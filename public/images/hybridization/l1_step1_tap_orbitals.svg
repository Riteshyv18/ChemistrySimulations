<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="2" y="2" width="156" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- s orbital pill -->
  <g transform="translate(14, 18)" filter="url(#shadow)">
    <rect width="36" height="32" rx="7" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.2" />
    <circle cx="18" cy="13" r="7" fill="url(#sGrad)" />
    <text x="18" y="16" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">s</text>
    <text x="18" y="27" font-family="system-ui, sans-serif" font-weight="800" font-size="6" fill="#7E22CE" text-anchor="middle">×1</text>
  </g>

  <!-- p orbital pill -->
  <g transform="translate(62, 18)" filter="url(#shadow)">
    <rect width="36" height="32" rx="7" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
    <circle cx="18" cy="13" r="7" fill="url(#pGrad)" />
    <text x="18" y="16" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">p</text>
    <text x="18" y="27" font-family="system-ui, sans-serif" font-weight="800" font-size="6" fill="#15803D" text-anchor="middle">×3</text>
  </g>

  <!-- d orbital pill -->
  <g transform="translate(110, 18)" filter="url(#shadow)">
    <rect width="36" height="32" rx="7" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
    <circle cx="18" cy="13" r="7" fill="url(#dGrad)" />
    <text x="18" y="16" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">d</text>
    <text x="18" y="27" font-family="system-ui, sans-serif" font-weight="800" font-size="6" fill="#B45309" text-anchor="middle">×2</text>
  </g>

  <!-- Tap indicator badge -->
  <g transform="translate(80, 58)">
    <rect x="-35" y="-7" width="70" height="14" rx="7" fill="#0284C7" />
    <text x="0" y="3" font-family="system-ui, sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TAP TO ADD</text>
  </g>
</svg>
