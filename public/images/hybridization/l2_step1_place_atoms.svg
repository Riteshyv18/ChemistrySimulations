<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="156" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Carbon pill -->
  <g transform="translate(24, 15)" filter="url(#shadow)">
    <rect width="48" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2" />
    <circle cx="24" cy="14" r="8" fill="url(#cGrad)" />
    <text x="24" y="17.5" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="24" y="29" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="#334155" text-anchor="middle">×2</text>
  </g>

  <!-- Hydrogen pill -->
  <g transform="translate(88, 15)" filter="url(#shadow)">
    <rect width="48" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
    <circle cx="24" cy="14" r="8" fill="url(#hGrad)" />
    <text x="24" y="17.5" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="24" y="29" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="#1D4ED8" text-anchor="middle">×4</text>
  </g>

  <!-- Tap indicator badge -->
  <g transform="translate(80, 62)">
    <rect x="-42" y="-7" width="84" height="14" rx="7" fill="#0284C7" />
    <text x="0" y="3.5" font-family="system-ui, sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PLACE 2C &amp; 4H</text>
  </g>
</svg>
