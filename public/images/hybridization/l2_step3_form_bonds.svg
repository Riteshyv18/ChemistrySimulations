<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="sigmaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="156" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Top Pi cloud -->
  <path d="M 46 16 Q 80 8 114 16 Q 80 22 46 16 Z" fill="url(#piGrad)" opacity="0.85" />
  <text x="80" y="17" font-family="system-ui, sans-serif" font-weight="900" font-size="6" fill="#FFFFFF" text-anchor="middle">π bond</text>

  <!-- Central Sigma axis & nuclei -->
  <line x1="30" y1="28" x2="130" y2="28" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2" />
  <ellipse cx="80" cy="28" rx="20" ry="8" fill="url(#sigmaGrad)" opacity="0.85" filter="url(#glow)" />
  <text x="80" y="30.5" font-family="system-ui, sans-serif" font-weight="900" font-size="6.5" fill="#FFFFFF" text-anchor="middle">σ bond</text>

  <!-- Carbon nuclei -->
  <circle cx="50" cy="28" r="6" fill="#1E293B" />
  <text x="50" y="30.5" font-family="system-ui, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle">C</text>
  <circle cx="110" cy="28" r="6" fill="#1E293B" />
  <text x="110" y="30.5" font-family="system-ui, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle">C</text>

  <!-- Bottom Pi cloud -->
  <path d="M 46 40 Q 80 34 114 40 Q 80 48 46 40 Z" fill="url(#piGrad)" opacity="0.85" />
  <text x="80" y="42.5" font-family="system-ui, sans-serif" font-weight="900" font-size="6" fill="#FFFFFF" text-anchor="middle">π bond</text>

  <!-- Tap indicator badge -->
  <g transform="translate(80, 62)">
    <rect x="-42" y="-7" width="84" height="14" rx="7" fill="#059669" />
    <text x="0" y="3.5" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FORM 1σ + 1π ✨</text>
  </g>
</svg>
