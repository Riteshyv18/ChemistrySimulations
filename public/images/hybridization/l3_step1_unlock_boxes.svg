<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="lobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="156" height="76" rx="10" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Mini Hybrid Lobe Visual -->
  <g transform="translate(42, 28)">
    <!-- Central atom -->
    <circle cx="0" cy="0" r="5" fill="#1E293B" />
    <!-- Left lobe -->
    <ellipse cx="-14" cy="0" rx="11" ry="6" fill="url(#lobeGrad)" opacity="0.9" />
    <!-- Right lobe -->
    <ellipse cx="14" cy="0" rx="11" ry="6" fill="url(#lobeGrad)" opacity="0.9" />
  </g>

  <!-- Clue Text -->
  <text x="42" y="47" font-family="system-ui, sans-serif" font-weight="800" font-size="7.5" fill="#334155" text-anchor="middle">2 hybrid orbitals</text>

  <!-- Arrow -->
  <path d="M74 34 L88 34" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
  <polygon points="88,31 94,34 88,37" fill="#0284C7" />

  <!-- Dropdown Box Selector -->
  <g transform="translate(100, 16)" filter="url(#shadow)">
    <rect width="48" height="26" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <text x="20" y="17" font-family="monospace, sans-serif" font-weight="900" font-size="11" fill="#0284C7">sp</text>
    <polygon points="38,13 42,13 40,17" fill="#64748B" />
  </g>

  <!-- Status unlocked pill -->
  <g transform="translate(80, 66)">
    <rect x="-46" y="-7" width="92" height="14" rx="7" fill="#10B981" />
    <text x="0" y="3.5" font-family="system-ui, sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">UNLOCK BOXES ✓</text>
  </g>
</svg>
