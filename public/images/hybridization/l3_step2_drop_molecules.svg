<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="156" height="76" rx="10" fill="url(#bgGrad2)" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Molecule Pill (BeCl2) -->
  <g transform="translate(16, 16)" filter="url(#shadow2)">
    <rect width="44" height="42" rx="8" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5" />
    <!-- Mini BeCl2 structure -->
    <circle cx="14" cy="18" r="4" fill="#10B981" />
    <line x1="14" y1="18" x2="22" y2="18" stroke="#64748B" stroke-width="2" />
    <circle cx="22" cy="18" r="5" fill="#0E7490" />
    <line x1="22" y1="18" x2="30" y2="18" stroke="#64748B" stroke-width="2" />
    <circle cx="30" cy="18" r="4" fill="#10B981" />
    <text x="22" y="34" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#0E7490" text-anchor="middle">BeCl₂</text>
  </g>

  <!-- Drag arrow -->
  <g transform="translate(72, 34)">
    <path d="M0,0 Q12,-8 24,0" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="3,2" />
    <polygon points="26,-3 26,4 20,1" fill="#0284C7" />
  </g>

  <!-- Target Box A (sp) -->
  <g transform="translate(100, 14)" filter="url(#shadow2)">
    <rect width="44" height="46" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="22" y="16" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#1E293B" text-anchor="middle">A</text>
    <text x="22" y="26" font-family="monospace, sans-serif" font-weight="800" font-size="9" fill="#2563EB" text-anchor="middle">sp</text>
    <rect x="6" y="31" width="32" height="11" rx="4" fill="#EFF6FF" />
    <text x="22" y="39.5" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="#1D4ED8" text-anchor="middle">DROP</text>
  </g>

  <!-- Bottom Tag -->
  <g transform="translate(80, 68)">
    <text x="0" y="3" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="#64748B" text-anchor="middle" letter-spacing="0.5">TAP OR DRAG MOLECULES</text>
  </g>
</svg>
