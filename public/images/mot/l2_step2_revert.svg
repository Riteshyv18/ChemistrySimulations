<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 90" width="180" height="90">
  <defs>
    <filter id="btnShadowRev" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2563eb" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean card background -->
  <rect x="2" y="2" width="176" height="86" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Revert Button Graphic -->
  <g transform="translate(90, 45)" filter="url(#btnShadowRev)">
    <rect x="-62" y="-18" width="124" height="36" rx="12" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5" />
    
    <!-- Undo / Revert Arrow Icon -->
    <path d="M -44 -2 C -44 -7 -38 -10 -31 -10 C -24 -10 -20 -6 -20 0 M -44 -2 L -48 -2 M -44 -2 L -44 3" 
          stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Button Label -->
    <text x="6" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">REVERT</text>
  </g>
</svg>
