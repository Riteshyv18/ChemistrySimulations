<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="slotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark container background matching simulator theme -->
  <rect x="2" y="2" width="276" height="146" rx="14" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5" />

  <!-- Direction Bar (Lowest -> Highest) with Gradient -->
  <g transform="translate(140, 24)">
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#0C4A6E" stroke="#0284C7" stroke-width="1.5" />
    <text x="-36" y="4" font-family="system-ui, sans-serif" font-weight="900" font-size="10.5" fill="#38BDF8" text-anchor="middle">LOWEST</text>
    <path d="M -2 0 L 14 0 M 10 -4 L 14 0 L 10 4" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="48" y="4" font-family="system-ui, sans-serif" font-weight="900" font-size="10.5" fill="#38BDF8" text-anchor="middle">HIGHEST</text>
  </g>

  <!-- 3 Empty Slot Boxes (Not filled) -->
  <!-- Box 1 -->
  <g transform="translate(17, 46)" filter="url(#slotGlow)">
    <rect x="0" y="0" width="74" height="86" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="5,4" />
    <circle cx="37" cy="36" r="16" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
    <text x="37" y="42" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">1</text>
    
    <rect x="13" y="60" width="48" height="16" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="37" y="71.5" font-family="system-ui, sans-serif" font-weight="800" font-size="8.5" fill="#94A3B8" text-anchor="middle">EMPTY</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(103, 46)" filter="url(#slotGlow)">
    <rect x="0" y="0" width="74" height="86" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="5,4" />
    <circle cx="37" cy="36" r="16" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
    <text x="37" y="42" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">2</text>
    
    <rect x="13" y="60" width="48" height="16" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="37" y="71.5" font-family="system-ui, sans-serif" font-weight="800" font-size="8.5" fill="#94A3B8" text-anchor="middle">EMPTY</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(189, 46)" filter="url(#slotGlow)">
    <rect x="0" y="0" width="74" height="86" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="5,4" />
    <circle cx="37" cy="36" r="16" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
    <text x="37" y="42" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">3</text>
    
    <rect x="13" y="60" width="48" height="16" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="37" y="71.5" font-family="system-ui, sans-serif" font-weight="800" font-size="8.5" fill="#94A3B8" text-anchor="middle">EMPTY</text>
  </g>
</svg>
