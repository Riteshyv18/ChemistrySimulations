<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="100%" height="100%">
  <defs>
    <linearGradient id="l2Bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Oxygen Red 3D Gradient -->
    <radialGradient id="oxygenGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Hydrogen 3D Gradient -->
    <radialGradient id="hGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Lone Pair Blue/Cyan Gradient -->
    <radialGradient id="lpGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="90%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="130" rx="14" fill="url(#l2Bg1)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Center Oxygen Atom -->
  <g transform="translate(100, 68)" filter="url(#shadow1)">
    <circle r="18" fill="url(#oxygenGrad1)" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="-5" cy="-5" rx="5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30 -5 -5)"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">O</text>
  </g>

  <!-- Target Slot Hole for H (Bottom Left) -->
  <g transform="translate(62, 96)">
    <circle r="12" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#0284c7" fill-opacity="0.9"/>
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">H Hole</text>
  </g>

  <!-- Target Slot Hole for LP (Top Right) -->
  <g transform="translate(138, 38)">
    <ellipse rx="13" ry="10" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="-16" y="-6" width="32" height="12" rx="3" fill="#7e22ce" fill-opacity="0.9"/>
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">LP Hole</text>
  </g>

  <!-- Dragging Atom H from top-left into hole -->
  <g transform="translate(35, 42)" filter="url(#shadow1)">
    <circle r="12" fill="url(#hGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#1e293b" text-anchor="middle">H</text>
  </g>
  <path d="M42 55 Q 48 78 58 86" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrowBlue)"/>
  <polygon points="56,88 62,88 60,82" fill="#0284c7"/>

  <!-- Dragging LP from right into hole -->
  <g transform="translate(195, 48)" filter="url(#shadow1)">
    <ellipse rx="12" ry="9" fill="url(#lpGrad1)" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">LP</text>
  </g>
  <path d="M182 48 Q 165 42 153 38" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 3"/>
  <polygon points="151,36 156,41 157,35" fill="#a855f7"/>

  <!-- Drag Hand Pointer Icon -->
  <g transform="translate(190, 72) scale(0.75)">
    <rect x="-4" y="-4" width="48" height="20" rx="6" fill="#1e293b" opacity="0.85"/>
    <text x="20" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">DRAG 👆</text>
  </g>
</svg>
