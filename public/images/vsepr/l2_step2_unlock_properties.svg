<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="100%" height="100%">
  <defs>
    <linearGradient id="l2Bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <radialGradient id="oxygenGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <radialGradient id="hGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="130" rx="14" fill="url(#l2Bg2)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Water molecule with 104.5 angle arc -->
  <g transform="translate(55, 60)" filter="url(#shadow2)">
    <!-- Bonds to Hydrogen -->
    <line x1="0" y1="0" x2="-26" y2="28" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="26" y2="28" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Oxygen Atom -->
    <circle r="17" fill="url(#oxygenGrad2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">O</text>

    <!-- Hydrogen 1 -->
    <circle cx="-26" cy="28" r="11" fill="url(#hGrad2)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="-26" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#1e293b" text-anchor="middle">H</text>

    <!-- Hydrogen 2 -->
    <circle cx="26" cy="28" r="11" fill="url(#hGrad2)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="26" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#1e293b" text-anchor="middle">H</text>

    <!-- Angle Arc -->
    <path d="M -13 14 A 19 19 0 0 0 13 14" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <!-- Angle Badge -->
    <rect x="-17" y="16" width="34" height="14" rx="4" fill="#15803d"/>
    <text x="0" y="26.5" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">104.5°</text>
  </g>

  <!-- Right: Unlocked Properties Card -->
  <g transform="translate(125, 20)">
    <rect width="102" height="90" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow2)"/>

    <!-- Header -->
    <g transform="translate(8, 16)">
      <circle cx="6" cy="0" r="5" fill="#22c55e"/>
      <text x="6" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="16" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#15803d">Unlocked!</text>
    </g>

    <!-- Shape Badge -->
    <rect x="8" y="26" width="41" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#64748b" text-anchor="middle">SHAPE</text>
    <text x="28" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#1e293b" text-anchor="middle">Bent</text>

    <!-- Lone Pairs Badge -->
    <rect x="53" y="26" width="41" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="73" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#64748b" text-anchor="middle">LONE PAIRS</text>
    <text x="73" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#2563eb" text-anchor="middle">2</text>

    <!-- Angle Badge -->
    <rect x="8" y="56" width="86" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="51" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#64748b" text-anchor="middle">BOND ANGLE</text>
    <text x="51" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#7e22ce" text-anchor="middle">104.5°</text>
  </g>
</svg>
