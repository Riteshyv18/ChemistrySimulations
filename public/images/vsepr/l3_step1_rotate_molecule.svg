<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradL3S1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Central Atom (Boron / Coral) -->
    <radialGradient id="gradCentral" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="85%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <!-- Outer Atom (Fluorine / Emerald) -->
    <radialGradient id="gradOuter" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

    <!-- Metallic Bond Gradient -->
    <linearGradient id="gradBond" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Cyan Rotation Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="280" height="130" rx="12" fill="url(#bgGradL3S1)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle 3D Grid Floor in background -->
  <ellipse cx="140" cy="98" rx="85" ry="24" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="140" cy="98" rx="50" ry="14" fill="none" stroke="#334155" stroke-width="1" opacity="0.4"/>

  <!-- Rotation Orbit Arc around Molecule -->
  <ellipse cx="140" cy="62" rx="95" ry="34" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,5" opacity="0.8" filter="url(#glowCyan)"/>
  
  <!-- Orbit Rotation Arrowhead Left -->
  <polygon points="45,60 52,53 53,67" fill="#06b6d4" filter="url(#glowCyan)"/>
  <!-- Orbit Rotation Arrowhead Right -->
  <polygon points="235,64 228,71 227,57" fill="#06b6d4" filter="url(#glowCyan)"/>

  <!-- 3D Molecule Model (Trigonal Planar BF3) -->
  <g transform="translate(140, 62)">
    <!-- Bonds -->
    <line x1="0" y1="0" x2="0" y2="-38" stroke="url(#gradBond)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-36" y2="24" stroke="url(#gradBond)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="36" y2="24" stroke="url(#gradBond)" stroke-width="5" stroke-linecap="round"/>

    <!-- Angle Arc between bottom bonds -->
    <path d="M -16 12 A 20 20 0 0 1 16 12" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-13" y="16" width="26" height="12" rx="4" fill="#f59e0b"/>
    <text x="0" y="25" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#0f172a" text-anchor="middle">?°</text>

    <!-- Outer Atom: Top (F) -->
    <g transform="translate(0, -38)">
      <circle r="13" fill="url(#gradOuter)" stroke="#15803d" stroke-width="1"/>
      <ellipse cx="-4" cy="-4" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
    </g>

    <!-- Outer Atom: Bottom-Left (F) -->
    <g transform="translate(-36, 24)">
      <circle r="13" fill="url(#gradOuter)" stroke="#15803d" stroke-width="1"/>
      <ellipse cx="-4" cy="-4" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
    </g>

    <!-- Outer Atom: Bottom-Right (F) -->
    <g transform="translate(36, 24)">
      <circle r="13" fill="url(#gradOuter)" stroke="#15803d" stroke-width="1"/>
      <ellipse cx="-4" cy="-4" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
    </g>

    <!-- Central Atom (B) -->
    <circle r="16" fill="url(#gradCentral)" stroke="#be123c" stroke-width="1.2"/>
    <ellipse cx="-5" cy="-5" rx="5" ry="2.5" fill="#ffffff" opacity="0.55"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- Left Badge: 3D Rotate Hint -->
  <g transform="translate(12, 12)">
    <rect width="84" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="10" cy="10" r="3.5" fill="#38bdf8"/>
    <text x="47" y="14" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8" text-anchor="middle">3D ROTATION</text>
  </g>

  <!-- Right Badge: Drag Instruction -->
  <g transform="translate(182, 12)">
    <rect width="86" height="20" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <!-- Hand Icon -->
    <path d="M 12 14 L 12 8 A 2 2 0 0 1 16 8 L 16 14" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <text x="50" y="14" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">DRAG TO ROTATE</text>
  </g>

  <!-- Bottom Helper Text -->
  <text x="140" y="120" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">
    Inspect bonds, lone pair clouds &amp; geometry in 3D
  </text>
</svg>
