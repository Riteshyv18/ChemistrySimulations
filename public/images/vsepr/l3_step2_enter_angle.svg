<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradL3S2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Green Glow for Input -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>

    <!-- Blue Glow for Submit -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="280" height="130" rx="12" fill="url(#bgGradL3S2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Side: Numeric Keypad (3 cols x 4 rows) -->
  <g transform="translate(14, 14)">
    <!-- Mini Keypad Container -->
    <rect width="90" height="98" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Row 1: 1, 2, 3 -->
    <rect x="6" y="6" width="22" height="18" rx="4" fill="#334155"/>
    <text x="17" y="19" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">1</text>
    <rect x="34" y="6" width="22" height="18" rx="4" fill="#38bdf8" filter="url(#glowBlue)"/>
    <text x="45" y="19" font-family="monospace" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">2</text>
    <rect x="62" y="6" width="22" height="18" rx="4" fill="#334155"/>
    <text x="73" y="19" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">3</text>

    <!-- Row 2: 4, 5, 6 -->
    <rect x="6" y="29" width="22" height="18" rx="4" fill="#334155"/>
    <text x="17" y="42" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">4</text>
    <rect x="34" y="29" width="22" height="18" rx="4" fill="#334155"/>
    <text x="45" y="42" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">5</text>
    <rect x="62" y="29" width="22" height="18" rx="4" fill="#334155"/>
    <text x="73" y="42" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">6</text>

    <!-- Row 3: 7, 8, 9 -->
    <rect x="6" y="52" width="22" height="18" rx="4" fill="#334155"/>
    <text x="17" y="65" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">7</text>
    <rect x="34" y="52" width="22" height="18" rx="4" fill="#334155"/>
    <text x="45" y="65" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">8</text>
    <rect x="62" y="52" width="22" height="18" rx="4" fill="#334155"/>
    <text x="73" y="65" font-family="monospace" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle">9</text>

    <!-- Row 4: ., 0, ✕ -->
    <rect x="6" y="75" width="22" height="18" rx="4" fill="#334155"/>
    <text x="17" y="87" font-family="monospace" font-size="11" font-weight="900" fill="#f8fafc" text-anchor="middle">.</text>
    <rect x="34" y="75" width="22" height="18" rx="4" fill="#38bdf8" filter="url(#glowBlue)"/>
    <text x="45" y="88" font-family="monospace" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">0</text>
    <rect x="62" y="75" width="22" height="18" rx="4" fill="#ef4444" opacity="0.8"/>
    <text x="73" y="87" font-family="monospace" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">✕</text>
  </g>

  <!-- Right Side: Angle Display Box + Submit Button + Slide Transition -->
  <g transform="translate(120, 14)">
    <!-- Angle Display Box (Active Green Correct 120°) -->
    <rect width="146" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.8" filter="url(#glowGreen)"/>
    <text x="73" y="22" font-family="monospace" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="1">
      120.0°
    </text>

    <!-- Submit Angle Button -->
    <g transform="translate(0, 42)">
      <rect width="146" height="30" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1" filter="url(#glowBlue)"/>
      <!-- Checkmark -->
      <circle cx="28" cy="15" r="7" fill="#ffffff" opacity="0.2"/>
      <path d="M 23 15 L 26.5 18.5 L 33 11" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="19" font-family="system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        SUBMIT ANGLE
      </text>
    </g>

    <!-- Slide Transition Arrow -->
    <g transform="translate(0, 80)">
      <rect width="146" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="64" y="14" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8" text-anchor="middle">
        NEXT MOLECULE SLIDES
      </text>
      <!-- Arrow -->
      <path d="M 124 10 L 134 10 M 130 6 L 134 10 L 130 14" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="140" y="123" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">
    Type the angle using the keypad &amp; submit to proceed
  </text>
</svg>
