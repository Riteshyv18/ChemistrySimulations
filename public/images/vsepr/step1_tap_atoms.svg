<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Carbon 3D Gradient -->
    <radialGradient id="carbon3d" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Hydrogen 3D Gradient -->
    <radialGradient id="hydrogen3d" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="130" rx="14" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Mini 3D Space Hint at Top -->
  <text x="120" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">
    3D WORKSHOP PALETTE
  </text>

  <!-- Atoms Dock Container -->
  <rect x="25" y="34" width="190" height="74" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dropShadow)"/>

  <!-- Carbon Atom Button -->
  <g transform="translate(75, 71)">
    <circle r="26" fill="url(#carbon3d)" stroke="#475569" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- Specular highlight -->
    <ellipse cx="-8" cy="-8" rx="7" ry="4" fill="#ffffff" opacity="0.35" transform="rotate(-30 -8 -8)"/>
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
  </g>

  <!-- Hydrogen Atom Button -->
  <g transform="translate(155, 71)">
    <circle r="26" fill="url(#hydrogen3d)" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- Specular highlight -->
    <ellipse cx="-8" cy="-8" rx="7" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 -8 -8)"/>
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#1e293b" text-anchor="middle">H</text>
  </g>

  <!-- Tap Hand Indicator Icon -->
  <g transform="translate(168, 82) scale(0.85)">
    <circle cx="10" cy="10" r="14" fill="#3b82f6" opacity="0.25"/>
    <circle cx="10" cy="10" r="9" fill="#3b82f6" opacity="0.45"/>
    <!-- Finger icon -->
    <path d="M10 2 C10 1, 12 1, 12 2 L12 10 L14 10 C15 10, 16 11, 16 12 L16 16 C16 19, 13 21, 10 21 C7 21, 5 19, 5 16 L5 11 C5 10, 6 10, 7 10 L8 10 L8 2 C8 1, 10 1, 10 2 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  </g>

  <!-- Tap Label -->
  <rect x="95" y="112" width="50" height="15" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="120" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#1d4ed8" text-anchor="middle">
    TAP ATOMS
  </text>
</svg>
