<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Carbon 3D Gradient -->
    <radialGradient id="carbon3d2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Hydrogen 3D Gradient -->
    <radialGradient id="hydrogen3d2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="130" rx="14" fill="url(#bgGrad2)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: 3D Atoms Connection -->
  <g transform="translate(10, 0)">
    <!-- Bond connecting C and H -->
    <line x1="48" y1="65" x2="88" y2="65" stroke="url(#bondGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Carbon Atom -->
    <g transform="translate(42, 65)">
      <circle r="22" fill="url(#carbon3d2)" stroke="#3b82f6" stroke-width="2.5" filter="url(#glowEffect)"/>
      <ellipse cx="-7" cy="-7" rx="6" ry="3.5" fill="#ffffff" opacity="0.4" transform="rotate(-30 -7 -7)"/>
      <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    </g>

    <!-- Hydrogen Atom -->
    <g transform="translate(94, 65)">
      <circle r="16" fill="url(#hydrogen3d2)" stroke="#3b82f6" stroke-width="2" filter="url(#glowEffect)"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="2.5" fill="#ffffff" opacity="0.7" transform="rotate(-30 -5 -5)"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#1e293b" text-anchor="middle">H</text>
    </g>
  </g>

  <!-- Connection Arrow -->
  <path d="M122 65 L138 65" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  <polygon points="138,61 144,65 138,69" fill="#3b82f6"/>

  <!-- Right: Single Bond Button -->
  <g transform="translate(148, 42)">
    <rect width="82" height="46" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#glowEffect)"/>
    <rect x="18" y="14" width="46" height="5" rx="2.5" fill="#2563eb"/>
    <text x="41" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#1d4ed8" text-anchor="middle">
      Single Bond
    </text>
  </g>

  <!-- Tap Pointer on Button -->
  <g transform="translate(202, 70) scale(0.85)">
    <circle cx="10" cy="10" r="13" fill="#2563eb" opacity="0.25"/>
    <circle cx="10" cy="10" r="8" fill="#2563eb" opacity="0.45"/>
    <path d="M10 2 C10 1, 12 1, 12 2 L12 10 L14 10 C15 10, 16 11, 16 12 L16 16 C16 19, 13 21, 10 21 C7 21, 5 19, 5 16 L5 11 C5 10, 6 10, 7 10 L8 10 L8 2 C8 1, 10 1, 10 2 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  </g>

  <!-- Bottom Subtitle Pill -->
  <rect x="45" y="106" width="150" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="120" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">
    TAP C &amp; H → CLICK SINGLE BOND
  </text>
</svg>
