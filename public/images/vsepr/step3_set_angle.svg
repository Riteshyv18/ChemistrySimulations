<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Blue Marked Hydrogen 3D Gradient -->
    <radialGradient id="blueH3d" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <!-- Carbon 3D Gradient -->
    <radialGradient id="carbon3d3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.45"/>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="130" rx="14" fill="url(#bgGrad3)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: 3D Atoms with Blue H atoms and Angle Arc -->
  <g transform="translate(10, 0)">
    <!-- Central C -->
    <g transform="translate(58, 48)">
      <circle r="16" fill="url(#carbon3d3)" stroke="#475569" stroke-width="1.5"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
    </g>

    <!-- Bonds from C to H1 and H2 -->
    <line x1="58" y1="48" x2="28" y2="86" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <line x1="58" y1="48" x2="88" y2="86" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <!-- Angle Arc -->
    <path d="M 40 70 A 24 24 0 0 1 76 70" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <rect x="44" y="66" width="28" height="13" rx="4" fill="#10b981"/>
    <text x="58" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">
      109.5°
    </text>

    <!-- Blue Marked H 1 -->
    <g transform="translate(26, 88)">
      <circle r="15" fill="url(#blueH3d)" stroke="#60a5fa" stroke-width="2.5" filter="url(#blueGlow)"/>
      <ellipse cx="-4" cy="-4" rx="4" ry="2" fill="#ffffff" opacity="0.6" transform="rotate(-30 -4 -4)"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">H</text>
    </g>

    <!-- Blue Marked H 2 -->
    <g transform="translate(90, 88)">
      <circle r="15" fill="url(#blueH3d)" stroke="#60a5fa" stroke-width="2.5" filter="url(#blueGlow)"/>
      <ellipse cx="-4" cy="-4" rx="4" ry="2" fill="#ffffff" opacity="0.6" transform="rotate(-30 -4 -4)"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">H</text>
    </g>
  </g>

  <!-- Right: Green Angle Input Box and Validation -->
  <g transform="translate(136, 36)">
    <!-- Input Box (Green when typed 109.5) -->
    <rect width="90" height="34" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#greenGlow)"/>
    <text x="45" y="22" font-family="monospace, monospace" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle">
      109.5°
    </text>

    <!-- Green Success Badge -->
    <g transform="translate(0, 42)">
      <rect width="90" height="22" rx="7" fill="#10b981"/>
      <circle cx="16" cy="11" r="5" fill="#ffffff"/>
      <path d="M 14 11 L 15.5 13 L 18 9" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="52" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">
        CORRECT!
      </text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="120" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">
    2 BLUE ATOMS → TYPE 109.5° (TURNS GREEN)
  </text>
</svg>
