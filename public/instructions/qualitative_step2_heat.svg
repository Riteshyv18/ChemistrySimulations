<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" fill="none">
  <!-- Container background -->
  <rect x="2" y="2" width="376" height="60" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Left Badge: Temp Controller 25°C -->
  <rect x="16" y="14" width="135" height="36" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="26" y="22" width="20" height="20" rx="10" fill="#0284C7"/>
  <text x="32" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">+</text>
  <text x="54" y="36.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Click [+] Nozzle</text>

  <!-- Flow Arrow with flame -->
